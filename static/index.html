<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veltiosi · search</title>
<style>
  :root {
    --bg: #0d1117; --bg-elevated: #161b22; --bg-card: #1c2128;
    --border: #30363d; --cyan: #58a6ff; --green: #3fb950;
    --amber: #d29922; --red: #f85149; --purple: #bc8cff;
    --text: #e6edf3; --text-dim: #8b949e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
           background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; color: var(--cyan); white-space: nowrap; }
  #q { flex: 1; padding: 10px 14px; background: var(--bg-card); color: var(--text);
       border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
  button { padding: 10px 16px; background: var(--cyan); color: #0d1117; border: 0;
           border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .hint { color: var(--text-dim); font-size: 13px; margin: 10px 0 20px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px;
          border: 1px solid var(--border); background: var(--bg-card); margin-right: 6px; }
  .pill.intent { color: var(--cyan); }
  .pill.domain { color: var(--amber); }
  .pill.source { color: var(--red); }
  .pill.conf { color: var(--green); }
  .route { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated);
           padding: 14px; margin-bottom: 18px; }
  .route h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
              color: var(--text-dim); margin: 0 0 10px; }
  .answer { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated);
            padding: 16px; margin-bottom: 18px; }
  .answer h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
               color: var(--text-dim); margin: 0 0 10px; }
  .answer .body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .answer .cites { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .note { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card);
          padding: 12px 14px; margin-bottom: 10px; }
  .note .title { font-weight: 600; font-size: 14px; }
  .note .meta { font-size: 11px; color: var(--text-dim); margin: 4px 0; }
  .note .snippet { font-size: 12.5px; color: var(--text); line-height: 1.5; }
  .jscore { float: right; color: var(--green); font-size: 12px; font-family: monospace; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px; }
  .spinner { color: var(--text-dim); padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Veltiosi · search</h1>
  <input id="q" placeholder="Ask anything across your vault… (e.g. 'what did we decide about the ETL?')" />
  <button id="go">Search</button>
</header>
<main id="main">
  <div class="hint">Jev classifies your query, routes it to the right handler, and re-ranks the vault retrieval.</div>
  <div class="empty" id="placeholder">Search to begin.</div>
</main>

<script>
async function jget(url) {
  try { const r = await fetch(url); if (!r.ok) return {_error:'HTTP '+r.status}; return await r.json(); }
  catch (e) { return {_error: e.message}; }
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(d) {
  const r = d.route || {};
  const res = d.result || {};
  const pills = `
    <span class="pill intent">intent: ${esc(r.intent||'—')}</span>
    <span class="pill domain">domain: ${esc(r.domain||'—')}${(r.secondary_domains||[]).length ? ' +'+esc(r.secondary_domains.join('+')) : ''}</span>
    <span class="pill source">source: ${esc(r.data_source||'—')}</span>
    <span class="pill conf">conf: ${r.intent_confidence != null ? r.intent_confidence.toFixed(2) : '—'}${r.available ? '' : ' (no Jev — legacy)'}</span>
    <span class="pill domain">answerable-from-notes: ${(r.answerable ?? 0.5).toFixed(2)}</span>`;

  const citeHtml = (res.citations||[]).length
    ? `<div class="cites">citations: ${(res.citations||[]).map(esc).join(' · ')}</div>` : '';

  const notesHtml = (d.notes||[]).map(n => `
    <div class="note">
      <div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(n.domain_folder||'root')} · ${esc(n.root_category||'—')} · ${esc(n.note_type||'—')}${(n.subcategories||[]).length ? ' · '+esc(n.subcategories.join(', ')) : ''}</div>
      <div class="snippet">${esc(n.snippet||'')}</div>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="route"><h2>Jev routing</h2>${pills}</div>
    <div class="answer"><h2>Answer</h2><div class="body">${esc(res.answer||'(no answer)')}</div>${citeHtml}</div>
    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim)">Relevant notes (${(d.notes||[]).length})</h2>
    ${notesHtml || '<div class="empty">no notes</div>'}`;
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('main').innerHTML = '<div class="spinner">classifying + retrieving…</div>';
  const d = await jget('/api/search?q=' + encodeURIComponent(q));
  if (d._error) { document.getElementById('main').innerHTML = `<div class="empty">${esc(d._error)}</div>`; return; }
  render(d);
}
document.getElementById('go').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
