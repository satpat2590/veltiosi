<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veltiosi · search everything</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --bg-elev: #161b22; --card: #1c2128;
    --border: #30363d; --cyan: #58a6ff; --green: #3fb950;
    --amber: #d29922; --red: #f85149; --purple: #bc8cff;
    --text: #e6edf3; --dim: #8b949e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--cyan); }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           background: var(--bg-elev); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; }
  .brand { font-weight: 700; font-size: 15px; color: var(--cyan); white-space: nowrap; letter-spacing: .3px; }
  .brand span { color: var(--dim); font-weight: 400; }
  #q { flex: 1; padding: 10px 14px; background: var(--card); color: var(--text);
       border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
  #q:focus { border-color: var(--cyan); }
  button { padding: 10px 16px; background: var(--cyan); color: #0d1117; border: 0;
           border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  button.ghost { background: transparent; color: var(--cyan); border: 1px solid var(--border); }
  label.toggle { font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }

  .container { max-width: 880px; margin: 0 auto; padding: 20px; }
  .empty { color: var(--dim); text-align: center; padding: 50px 0; font-size: 14px; }

  .livesrc { border: 1px solid var(--border); border-left: 3px solid var(--green);
             background: var(--bg-elev); border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; }
  .livesrc h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--green); }
  .livesrc pre { margin: 0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                 font-size: 12.5px; line-height: 1.5; color: var(--text); }

  .result { border: 1px solid var(--border); background: var(--card); border-radius: 8px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .12s, background .12s; }
  .result:hover { border-color: var(--cyan); background: var(--bg-elev); }
  .result .head { display: flex; align-items: baseline; gap: 10px; }
  .result .rank { color: var(--dim); font-size: 12px; min-width: 18px; font-variant-numeric: tabular-nums; }
  .result .title { font-weight: 600; font-size: 14px; flex: 1; }
  .result .rel { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .result .rel strong { color: var(--green); }
  .result .snippet { font-size: 12.5px; color: var(--dim); margin-top: 6px; line-height: 1.45;
                     display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .note-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .note-head button { background: transparent; color: var(--cyan); border: 1px solid var(--border); padding: 7px 13px; font-size: 12px; }
  .note-head .path { color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .note-body { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
               padding: 24px 28px; font-size: 15px; line-height: 1.65; }
  .note-body h1, .note-body h2, .note-body h3, .note-body h4 { margin: 1.2em 0 .5em; line-height: 1.3; }
  .note-body h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .note-body h2 { font-size: 1.3em; }
  .note-body h3 { font-size: 1.1em; }
  .note-body p { margin: .6em 0; }
  .note-body code { background: var(--card); padding: 2px 6px; border-radius: 4px; font-size: .88em;
                    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note-body pre { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                   padding: 14px; overflow-x: auto; }
  .note-body pre code { background: none; padding: 0; }
  .note-body blockquote { border-left: 3px solid var(--amber); margin: .8em 0; padding: .2em 1em; color: var(--dim); }
  .note-body table { border-collapse: collapse; margin: 1em 0; width: 100%; }
  .note-body th, .note-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; font-size: .92em; }
  .note-body th { background: var(--card); }
  .note-body ul, .note-body ol { padding-left: 1.6em; }
  .note-body li { margin: .3em 0; }
  .note-body hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }
  .spinner { color: var(--dim); text-align: center; padding: 40px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand">Veltiosi <span>· search everything</span></div>
  <input id="q" placeholder="Search your vault, health, portfolios, history, music, tasks…" />
  <label class="toggle"><input type="checkbox" id="rerank" checked> Jev re-rank</label>
  <button id="go">Search</button>
</header>

<div class="container" id="view">
  <div class="empty">Search across all of Omni — type above and press Enter.</div>
</div>

<script>
async function jget(url) {
  try { const r = await fetch(url); if (!r.ok) return {_error:'HTTP '+r.status}; return await r.json(); }
  catch (e) { return {_error: e.message}; }
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderMarkdown(md) {
  md = (md||'').replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');                 // strip YAML frontmatter
  md = md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a);   // wikilinks -> text
  return DOMPurify.sanitize(marked.parse(md, { gfm: true, breaks: true }));
}

function showSearch(d) {
  let html = '';
  if (d.source && d.source_text) {
    html += `<div class="livesrc"><h3>live · ${esc(d.source)}</h3><pre>${esc(d.source_text)}</pre></div>`;
  }
  if (!d.notes.length) {
    html += `<div class="empty">No results for “${esc(d.query)}”.</div>`;
  } else {
    html += d.notes.map((n, i) => `
      <div class="result" onclick="openNote('${encodeURIComponent(n.path)}')">
        <div class="head">
          <span class="rank">${i+1}</span>
          <span class="title">${esc(n.title)}</span>
          <span class="rel"><strong>${(n.score*100).toFixed(0)}%</strong> match</span>
        </div>
        <div class="snippet">${esc(n.snippet || '')}</div>
      </div>`).join('');
  }
  document.getElementById('view').innerHTML = html;
}

async function openNote(path) {
  document.getElementById('view').innerHTML = '<div class="spinner">loading…</div>';
  const n = await jget('/api/note?path=' + path);
  if (n._error) { document.getElementById('view').innerHTML = `<div class="empty">${esc(n._error)}</div>`; return; }
  history.pushState(null, '', '#note=' + encodeURIComponent(path));
  document.getElementById('view').innerHTML = `
    <div class="note-head">
      <button onclick="goHome()">← back</button>
      <div><div style="font-weight:700;font-size:17px">${esc(n.title)}</div>
      <div class="path">${esc(n.path)}</div></div>
    </div>
    <div class="note-body">${renderMarkdown(n.content)}</div>`;
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const rerank = document.getElementById('rerank').checked;
  document.getElementById('view').innerHTML = '<div class="spinner">searching…</div>';
  const d = await jget('/api/search?q=' + encodeURIComponent(q) + (rerank ? '&rerank=true' : ''));
  if (d._error) { document.getElementById('view').innerHTML = `<div class="empty">${esc(d._error)}</div>`; return; }
  history.pushState(null, '', '#');
  showSearch(d);
}

function goHome() {
  history.pushState(null, '', '#');
  document.getElementById('view').innerHTML = '<div class="empty">Search across all of Omni.</div>';
}

function onHash() {
  const h = decodeURIComponent(location.hash || '');
  if (h.startsWith('#note=')) openNote(h.slice('#note='.length));
}

document.getElementById('go').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
window.addEventListener('hashchange', onHash);
if (location.hash.startsWith('#note=')) onHash();
</script>
</body>
</html>
